# Conda env for Fast-PGSR (third_party/FastGS). Separate from `snap3d` because FastGS builds its
# CUDA extensions against torch 2.11 / CUDA 12.8. setup.sh creates it and builds the extensions.
name: fastgs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0
      - torchvision==0.26.0
      - numpy
      - scipy
      - pillow
      - tqdm
      - plyfile
      - opencv-python-headless
      - trimesh
      - open3d
      - lpips
