[project]
name = "snap3d"
version = "0.1.0"
description = "Multi-view photos -> low-poly mesh + SH texture bundle for web rendering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "pillow>=10.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "trimesh>=4.2",
  "open3d>=0.18",
  "pymeshlab>=2023.12",
  "xatlas>=0.0.9",
  "rtree>=1.2",           # spatial index backend used by trimesh raycasting fallback
  "embreex>=4.4",         # accelerated BVH ray casting for baking.py
  "torch>=2.5",           # CG texel reconstruction + AtA/Atb SH solve in slf_fit.py
  "moderngl>=5.10",       # headless GPU mesh rasterization in camera_raster.py
]

[project.optional-dependencies]
# Heavy / hardware-specific deps kept separate so the rest of the scaffold
# can be installed and unit-tested without a GPU or large downloads.
masking = [
  "torchvision>=0.20",
  "einops",                # sam3 imports these two without declaring them
  "pycocotools",
  "setuptools<81",         # sam3 imports pkg_resources, which setuptools 81+ no longer ships
  # sam3 pins numpy<2. The checkpoint is Hugging Face-gated (facebook/sam3): `hf auth login`.
  "sam3 @ git+https://github.com/facebookresearch/sam3.git",
]
viewer = [
  "pygame>=2.5",           # viewers/ only - interactive windowing (moderngl is a core dep)
]
all = ["snap3d[masking,viewer]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
