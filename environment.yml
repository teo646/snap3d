# Main conda env: GPU-enabled COLMAP + Python 3.12. ./setup.sh creates it and runs the pip step;
# by hand:
#
#   conda env create -f environment.yml
#   conda activate snap3d
#   pip install -e ".[all]"        # the pipeline + SAM3 and the viewers' pygame
#
# Why the exact build strings: conda-forge's `colmap` package doesn't declare
# `libfaiss`/`openimageio` as hard runtime dependencies even though the binary
# is linked against them, so a plain `colmap` install can silently produce a
# binary that fails with "error while loading shared libraries". Pinning the
# exact builds below is the known-working combination (verified against this
# machine's driver/CUDA 13.0 + RTX 50-series GPU).
name: snap3d
channels:
  - conda-forge
dependencies:
  - python=3.12
  - colmap=4.0.4=cuda_129hb658b90_2
  - libfaiss=1.10.0=cuda129_openblas_hd5b4706_200
  - openimageio=3.1.14.1=h3b81b02_2
  - pip
