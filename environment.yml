# Main conda env: GPU-enabled COLMAP + Python 3.12. ./setup.sh creates it and runs
# `pip install -e ".[all]"`. The pinned builds keep colmap's libfaiss/openimageio links working.
name: snap3d
channels:
  - conda-forge
dependencies:
  - python=3.12
  - colmap=4.0.4=cuda_129hb658b90_2
  - libfaiss=1.10.0=cuda129_openblas_hd5b4706_200
  - openimageio=3.1.14.1=h3b81b02_2
  - pip
