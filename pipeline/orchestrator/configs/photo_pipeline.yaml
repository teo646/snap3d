# Photo-input pipeline: COLMAP SfM -> SAM3 masking -> Fast-PGSR surface reconstruction
# (third_party/FastGS) -> hole closing -> decimation -> UV unwrap -> baking -> SLF fit -> export.
#
# Run with:
#   python -m pipeline.orchestrator.runner \
#       --config pipeline/orchestrator/configs/photo_pipeline.yaml \
#       --input /path/to/photo/dir \
#       --text "object description for SAM3"
#
# masking runs after resize_dataset so SAM3 segments the exact images Fast-PGSR trains on.
# surface_recon trains on masking's background-cut images and supervises the silhouette through
# `lambda_mask_alpha`. surface_recon runs in the separate `fastgs` conda env.

run_id_prefix: photo

stages:
  - id: ingest
    module: pipeline.stages.ingest.run
    uses_source_input: true
    inputs: {}
    params:
      mode: photo
      colmap_binary: colmap
      camera_model: SIMPLE_RADIAL
      single_camera: true
      use_gpu: true
      matcher: exhaustive

  - id: resize_dataset
    module: pipeline.stages.resize_dataset.run
    inputs:
      posed_images: ingest
    params:
      colmap_binary: colmap
      max_image_size: 2000

  - id: masking
    module: pipeline.stages.masking.run
    inputs:
      images: resize_dataset
    params:
      # text_prompt comes from the CLI's --text.
      images_subdir: _workspace/dense/images
      # Also write a masked-background `images/` folder for surface_recon to train on.
      write_masked_images: true
      # Pixels the SAM3 silhouette is grown by, in the masks and the cut images.
      mask_dilation_px: 2

  - id: surface_recon
    module: pipeline.stages.surface_recon_fastpgsr.run
    inputs:
      poses: resize_dataset   # cameras, sparse points, original images
      masked_images: masking  # images/: background-cut training images
      masks: masking          # masks/: alpha for the TSDF render dataset
    params:
      iterations: 30000
      max_depth: 8.0
      voxel_size: 0.002
      use_depth_filter: true
      # FastGS parameters (upstream's run_tnt.py values).
      ncc_scale: 0.5
      opacity_cull_threshold: 0.05
      exposure_compensation: true
      densification_interval: 500
      highfeature_lr: 0.02
      grad_abs_thresh: 0.0004
      mult: 0.7
      multi_view_weight_until_iter: 10000
      # Weight on |rendered_alpha - mask|, applied from iteration 7000.
      lambda_mask_alpha: 0.5

  - id: hole_close
    module: pipeline.stages.hole_close.run
    inputs:
      mesh: surface_recon
    params:
      # PyMeshLab maxholesize in boundary edges; 0 = pass-through.
      max_hole_size: 5000

  - id: decimation
    module: pipeline.stages.decimation.run
    inputs:
      mesh: hole_close
    params:
      target_face_count: 50000

  - id: uv_unwrap
    module: pipeline.stages.uv_unwrap.run
    inputs:
      mesh: decimation
    params:
      texture_resolution: [1024, 1024]
      margin_texels: 2

  - id: baking
    module: pipeline.stages.baking.run
    inputs:
      highpoly_mesh: hole_close
      uv_mesh: uv_unwrap
    params:
      gutter_texels: 1  # must equal uv_unwrap's margin_texels / 2

  - id: slf
    module: pipeline.stages.slf.run
    inputs:
      posed_images: ingest
      uv_mesh: uv_unwrap
      height_map: baking
      masking: masking           # observations outside the object's silhouette are dropped
      highpoly_mesh: hole_close  # reference depth when depth_reference is highpoly
      gaussians: surface_recon   # reference depth when depth_reference is gaussians
    params:
      # Drop a pixel when its surface depth differs from the reference depth by more than this fraction.
      depth_test_tolerance: 0.005
      depth_reference: gaussians
      sh_degree: 1
      min_observations_per_texel: 3
      ridge: 1.0e-4
      num_steps: 7  # match view_slf.py's --num-steps default
      recon_min_precision: 0.0
      # Reject texels whose total precision is under ridge * this.
      min_precision_ridge_ratio: 10.0
      border_margin_frac: 0.0  # exclude the outer N% of each photo from sampling; 0 = off
      device: cuda

  - id: slf_bound
    module: pipeline.stages.slf_bound.run
    inputs:
      slf: slf
    params:
      # Keep each texel's fitted function inside its observed colours +- this, clamped to [0, 1].
      range_tolerance: 0.02

  - id: export
    module: pipeline.stages.export.run
    inputs:
      posed_images: ingest  # only to aim the initial view
      uv_mesh: uv_unwrap
      slf: slf_bound
    # Writes <run_id>_unorm8.snap3d/ and <run_id>_float16.snap3d/ (see pipeline/core/render_bundle.py).
    params:
      # float16 bundle only: zero coefficient k below step * k, keep 5 of float16's 10 mantissa bits.
      sh_zero_threshold_step: 0.015
      sh_mantissa_bits: 5
